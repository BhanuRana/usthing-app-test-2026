#flow: Demo · Map
#intent:
# The prerequisite map: open it, see the whole chain, select a course to light up its
# lineage, re-centre on it, then explore forward: each tap opens what that course leads to,
# with a breadcrumb back.
appId: ${MAESTRO_APP_ID}
---
- runFlow: { file: _pause.yaml, env: { MS: 800 } }
- tapOn: '.*Search code or title.*'
- inputText: 'comp 3711'
- hideKeyboard
- tapOn:
    id: 'course-row-COMP 3711'
- runFlow: { file: _pause.yaml, env: { MS: 700 } }
- scrollUntilVisible:
    element:
      id: 'open-map'
    direction: DOWN
    speed: 40
- tapOn:
    id: 'open-map'
- runFlow: { file: _pause.yaml, env: { MS: 2000 } }
- tapOn:
    id: 'map-fit'
- runFlow: { file: _pause.yaml, env: { MS: 1600 } }
- tapOn:
    id: 'map-node-COMP 2011'
- runFlow: { file: _pause.yaml, env: { MS: 2000 } }
- tapOn:
    id: 'map-centre'
- runFlow: { file: _pause.yaml, env: { MS: 1500 } }
- tapOn:
    id: 'map-fit'
- runFlow: { file: _pause.yaml, env: { MS: 1200 } }
- tapOn:
    id: 'map-node-COMP 2012'
- runFlow: { file: _pause.yaml, env: { MS: 2200 } }
- tapOn:
    id: 'map-node-COMP 4211'
- runFlow: { file: _pause.yaml, env: { MS: 2200 } }
- tapOn:
    id: 'map-crumb-COMP 2011'
- runFlow: { file: _pause.yaml, env: { MS: 2200 } }
