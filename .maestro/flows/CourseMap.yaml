#flow: CourseMap
#intent:
# The prerequisite map: open it from a course, fit, select a course (lineage + card),
# both sides at once, mark a course completed from the map, re-centre on another course, explore forward along "leads to" with the
# breadcrumb, come back, open a course from the map,
# the real prerequisite loop, and no map button when there's nothing to draw.
appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
---
- tapOn: '.*Search code or title.*'
- inputText: 'comp 3711'
- tapOn:
    id: 'course-row-COMP 3711'
- scrollUntilVisible:
    element:
      id: 'open-map'
    direction: DOWN
- tapOn:
    id: 'open-map'
- assertVisible: 'Course map'
- assertVisible:
    id: 'map-node-COMP 3711'

# Fit the whole map, then select a prerequisite: its card shows where it sits on the path.
- tapOn:
    id: 'map-fit'
- tapOn:
    id: 'map-node-COMP 2011'
- assertVisible:
    id: 'map-selected'
- assertVisible: 'Step 2 of your path'
- takeScreenshot: map-selected

# Both sides at once: prerequisites on the left, what it leads to on the right.
- tapOn:
    id: 'map-fit'
- assertVisible:
    id: 'map-node-COMP 4411'
- assertVisible:
    id: 'map-node-COMP 2011'

# Mark the selected prerequisite (COMP 2011) completed from the map: the card asks about its
# own prerequisites, then it reads as completed and its "one of" group is met.
- tapOn:
    id: 'map-toggle-completed'
- assertVisible:
    id: 'complete-prompt'
- tapOn:
    id: 'complete-with-prerequisites'
- assertVisible: 'Completed · Undo'
- assertVisible: 'ONE OF 3 ✓'
- tapOn: 'Close'

# Re-centre on COMP 2011, then come back to COMP 3711's map.
- tapOn:
    id: 'map-fit'
- tapOn:
    id: 'map-node-COMP 2011'
- tapOn:
    id: 'map-centre'
- assertVisible:
    id: 'map-node-COMP 2011'
- assertNotVisible:
    id: 'map-node-COMP 3711'

# Explore forward: tapping a "leads to" course opens a column with what *it* leads to,
# and the breadcrumb tracks the route; tapping the first crumb goes back.
- tapOn:
    id: 'map-fit'
- tapOn:
    id: 'map-node-COMP 2012'
- assertVisible: 'Leads to 23 courses'
- assertVisible:
    id: 'map-crumb-COMP 2012'
- takeScreenshot: map-explore
- tapOn:
    id: 'map-crumb-COMP 2011'
- assertNotVisible:
    id: 'map-crumb-COMP 2012'
- tapOn: 'Back'
# Back on COMP 3711's map (the title), still centred on the selection.
- assertVisible: 'COMP 3711'

# Coming back keeps the selection; open that course from the map.
- assertVisible:
    id: 'map-selected'
- tapOn:
    id: 'map-open-course'
- assertVisible: 'Programming with C\+\+'
- tapOn: 'Back'
- tapOn: 'Back'
- tapOn: 'Back'

# The real loop: UCMP 6030 <-> UCMP 6040.
- tapOn: '.*Search code or title.*'
- eraseText: 20
- inputText: 'ucmp 6030'
- tapOn:
    id: 'course-row-UCMP 6030'
- scrollUntilVisible:
    element:
      id: 'open-map'
    direction: DOWN
- tapOn:
    id: 'open-map'
- tapOn:
    id: 'map-node-UCMP 6040'
- assertVisible: 'Part of a prerequisite loop'
- tapOn: 'Back'
- tapOn: 'Back'

# Nothing to draw: no map button.
- tapOn: '.*Search code or title.*'
- eraseText: 20
- inputText: 'acct 1610'
- tapOn:
    id: 'course-row-ACCT 1610'
- assertVisible: 'No prerequisites listed.'
- assertNotVisible:
    id: 'open-map'
